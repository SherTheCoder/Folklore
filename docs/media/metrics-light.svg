<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Kikkar on STM32N657 and ESP32: idle CPU, RAM and latency</title>
<desc id="d">STM32N657 premium: 0.5% idle CPU, 150 KB RAM, 80 ms latency. ESP32 budget: 4% idle CPU, 190 KB RAM, 90 ms latency. Limits: under 10% idle CPU and under 256 KB RAM.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#59636e"/></marker></defs>
<rect x="124.0" y="9.0" width="11.0" height="11.0" rx="2" fill="#2a78d6"/>
<text x="142.0" y="19.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">STM32N657, premium</text>
<rect x="314.0" y="9.0" width="11.0" height="11.0" rx="2" fill="#eb6834"/>
<text x="332.0" y="19.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">ESP32, budget</text>
<text x="0.0" y="56.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Idle CPU while listening</text>
<text x="0.0" y="75.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Lower is better. The problem statement asks for under 10%.</text>
<line x1="707.3" y1="83.0" x2="707.3" y2="144.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/>
<text x="713.3" y="92.0" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">limit 10%</text>
<line x1="124.0" y1="86.0" x2="124.0" y2="144.0" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round"/>
<text x="112.0" y="105.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end">STM32N657</text>
<path d="M124.0 90.0 H149.2 A4.0 4.0 0 0 1 153.2 94.0 V106.0 A4.0 4.0 0 0 1 149.2 110.0 H124.0 Z" fill="#2a78d6"/>
<text x="161.2" y="105.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">0.5%</text>
<text x="112.0" y="135.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end">ESP32</text>
<path d="M124.0 120.0 H353.3 A4.0 4.0 0 0 1 357.3 124.0 V136.0 A4.0 4.0 0 0 1 353.3 140.0 H124.0 Z" fill="#eb6834"/>
<text x="365.3" y="135.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">4%</text>
<line x1="0.0" y1="154.0" x2="880.0" y2="154.0" stroke="#eaeef2" stroke-width="1" stroke-linecap="round"/>
<text x="0.0" y="176.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">RAM used</text>
<text x="0.0" y="195.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Lower is better. The limit is 256 KB.</text>
<line x1="721.3" y1="203.0" x2="721.3" y2="264.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/>
<text x="727.3" y="212.0" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">limit 256 KB</text>
<line x1="124.0" y1="206.0" x2="124.0" y2="264.0" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round"/>
<text x="112.0" y="225.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end">STM32N657</text>
<path d="M124.0 210.0 H470.0 A4.0 4.0 0 0 1 474.0 214.0 V226.0 A4.0 4.0 0 0 1 470.0 230.0 H124.0 Z" fill="#2a78d6"/>
<text x="482.0" y="225.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">150 KB</text>
<text x="112.0" y="255.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end">ESP32</text>
<path d="M124.0 240.0 H563.3 A4.0 4.0 0 0 1 567.3 244.0 V256.0 A4.0 4.0 0 0 1 563.3 260.0 H124.0 Z" fill="#eb6834"/>
<text x="575.3" y="255.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">190 KB</text>
<line x1="0.0" y1="274.0" x2="880.0" y2="274.0" stroke="#eaeef2" stroke-width="1" stroke-linecap="round"/>
<text x="0.0" y="296.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Handoff latency</text>
<text x="0.0" y="315.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">From the end of the keyword to audio reaching the ASR server. Lower is better.</text>
<line x1="124.0" y1="326.0" x2="124.0" y2="384.0" stroke="#d1d9e0" stroke-width="1" stroke-linecap="round"/>
<text x="112.0" y="345.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end">STM32N657</text>
<path d="M124.0 330.0 H680.0 A4.0 4.0 0 0 1 684.0 334.0 V346.0 A4.0 4.0 0 0 1 680.0 350.0 H124.0 Z" fill="#2a78d6"/>
<text x="692.0" y="345.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">80 ms</text>
<text x="112.0" y="375.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end">ESP32</text>
<path d="M124.0 360.0 H750.0 A4.0 4.0 0 0 1 754.0 364.0 V376.0 A4.0 4.0 0 0 1 750.0 380.0 H124.0 Z" fill="#eb6834"/>
<text x="762.0" y="375.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">90 ms</text>
</svg>
