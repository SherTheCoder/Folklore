<rect x="591.0" y="206.0" width="128.0" height="26.0" rx="4" fill="#9085e9"/>
<text x="655.0" y="223.5" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">neural network</text>
<text x="0.0" y="255.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Link kept alive</text>
<rect x="161.0" y="238.0" width="558.0" height="26.0" rx="4" fill="#3d444d"/>
<text x="440.0" y="255.5" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">base RAM that keeps the connection open</text>
<text x="740.0" y="226.0" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="start">18 KB</text>
<text x="740.0" y="243.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">saved</text>
